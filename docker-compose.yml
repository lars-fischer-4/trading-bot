services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade
    restart: unless-stopped
    # Weboberflaeche im Heimnetz: http://tradingpi.local:8080 (Router leitet den Port nicht weiter)
    ports:
      - "8080:8080"
    volumes:
      - ./user_data:/freqtrade/user_data
    environment:
      # Geheimnisse kommen aus der Datei .env (liegt nur auf dem Pi, nie im Repo)
      FREQTRADE__TELEGRAM__TOKEN: ${TELEGRAM_TOKEN}
      FREQTRADE__TELEGRAM__CHAT_ID: ${TELEGRAM_CHAT_ID}
      FREQTRADE__EXCHANGE__KEY: ${EXCHANGE_KEY:-}
      FREQTRADE__EXCHANGE__SECRET: ${EXCHANGE_SECRET:-}
      # Weboberflaeche (FreqUI): Zugangsdaten erzeugt deploy/auto-update.sh einmalig in .env
      FREQTRADE__API_SERVER__ENABLED: ${UI_ENABLED:-false}
      FREQTRADE__API_SERVER__USERNAME: ${UI_USER:-}
      FREQTRADE__API_SERVER__PASSWORD: ${UI_PASSWORD:-}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${UI_JWT_SECRET:-nur-platzhalter-solange-die-oberflaeche-aus-ist}
      FREQTRADE__API_SERVER__WS_TOKEN: ${UI_WS_TOKEN:-}
      TZ: Europe/Zurich
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
      --config /freqtrade/user_data/config.json
      --strategy ComboV1


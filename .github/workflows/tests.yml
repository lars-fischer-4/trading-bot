name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install freqtrade pytest
      - run: python -m pytest -q tests
      - run: freqtrade list-strategies -c user_data/config.json --userdir user_data

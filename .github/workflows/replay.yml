name: Replay recent trades
on:
  push:
    branches: [replay]
jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install freqtrade
      - name: Download candles
        run: |
          freqtrade download-data --config user_data/config.json --userdir user_data --exchange bitvavo -t 5m 4h --timerange 20250601- --data-format-ohlcv feather
      - name: Backtest since 2026-10-06
        run: |
          echo '{"telegram":{"enabled":false},"api_server":{"jwt_secret_key":"replay-placeholder-0000000000000000000"}}' > /tmp/o.json
          freqtrade backtesting --config user_data/config.json --config /tmp/o.json --userdir user_data --strategy ComboV1 --timerange 20261006- --enable-protections --fee 0.0025 --export trades --cache none > /tmp/bt.txt 2>&1; tail -80 /tmp/bt.txt
      - name: Trades and prices
        run: |
          python - > /tmp/trades.txt <<'PY'
          import glob, json, zipfile
          import pandas as pd
          z = sorted(glob.glob('user_data/backtest_results/*.zip'))[-1]
          zz = zipfile.ZipFile(z)
          n = [x for x in zz.namelist() if x.endswith('.json') and '_config' not in x and 'meta' not in x and 'market_change' not in x][0]
          d = json.loads(zz.read(n))
          for name, st in d['strategy'].items():
              for t in st['trades']:
                  print(t['pair'], t['enter_tag'], t['open_date'], round(t['open_rate'], 4), t['close_date'], round(t['close_rate'], 4),
                        t['exit_reason'], round(t['stake_amount'], 2), round(t['profit_abs'], 2), f"{100*t['profit_ratio']:.1f}%")
          for p in ['BTC_EUR','ETH_EUR','XRP_EUR','SOL_EUR','ADA_EUR','SUI_EUR','DOGE_EUR','LINK_EUR','FET_EUR','TAO_EUR']:
              df = pd.read_feather(f'user_data/data/bitvavo/{p}-5m.feather')
              df = df[df.date >= '2026-10-06']
              dd = df.close / df.high.rolling(12).max().shift(1) - 1
              print(p, 'close 06.10. 08:00', df[df.date >= '2026-10-06 08:00'].close.iloc[0], 'now', df.close.iloc[-1], 'max 1h drop', round(dd.min(), 3), dd.idxmin() and df.loc[dd.idxmin(), 'date'])
          for p in ['BTC_EUR', 'ETH_EUR']:
              df = pd.read_feather(f'user_data/data/bitvavo/{p}-4h.feather')
              df['sma'] = df['close'].rolling(300).mean()
              df['rel'] = df['close'] / df['sma'] - 1
              print(p)
              print(df[['date', 'close', 'sma', 'rel']].iloc[::6].tail(25).to_string(index=False))
              print(df[df.date >= '2026-10-05'][['date', 'close', 'sma', 'rel']].to_string(index=False))
          PY
      - name: Publish output to branch replay-out
        run: |
          mkdir /tmp/pub && cp /tmp/bt.txt /tmp/trades.txt /tmp/pub/ && cd /tmp/pub
          git init -q -b replay-out
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "replay output $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" replay-out
